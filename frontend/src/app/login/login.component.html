<div class="login-wrapper">
  <div class="login-card shadow-sm border-0 rounded-4">
    <div class="p-4 p-md-5">
      
      <!-- Brand & Header -->
      <div class="text-center mb-4">
        <div class="brand-icon mb-2">🏥</div>
        <h3 class="fw-bold text-dark mb-1">OPD Management</h3>
        <p class="text-muted small">Sign in to your account</p>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="alert alert-danger py-2 text-center small mb-3 border-0 rounded-3">
        {{ errorMessage }}
      </div>

      <!-- Clean Form -->
      <form (ngSubmit)="onLogin()">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-secondary">Email / Username</label>
          <input 
            type="text" 
            class="form-control py-2.5 rounded-3 bg-light border-0" 
            [(ngModel)]="email" 
            name="email" 
            placeholder="Enter your email or username" 
            required
            autocomplete="username">
        </div>

        <div class="mb-4">
          <label class="form-label small fw-semibold text-secondary">Password</label>
          <input 
            type="password" 
            class="form-control py-2.5 rounded-3 bg-light border-0" 
            [(ngModel)]="password" 
            name="password" 
            placeholder="Enter your password" 
            required
            autocomplete="current-password">
        </div>

        <button 
          type="submit" 
          class="btn btn-primary w-100 py-2.5 rounded-3 fw-semibold shadow-sm mb-3" 
          [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          {{ loading ? 'Signing In...' : 'Login' }}
        </button>

        <div class="text-center">
          <span class="text-muted small">Don't have an account? </span>
          <a routerLink="/register" class="text-primary fw-semibold text-decoration-none small">Create Account</a>
        </div>
      </form>

    </div>
  </div>
</div>
