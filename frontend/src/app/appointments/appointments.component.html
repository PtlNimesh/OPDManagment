<div class="row">
  <div class="col-md-4">
    <div class="card mb-4">
      <div class="card-header bg-warning text-dark">
        <h4 class="mb-0">Book Appointment</h4>
      </div>
      <div class="card-body">
        <form (ngSubmit)="bookAppointment()">
          <div class="mb-3">
            <label class="form-label">Patient</label>
            <select class="form-select" [(ngModel)]="newAppt.patientId" name="patient" required>
              <option [ngValue]="null">Select Patient</option>
              <option *ngFor="let p of patients" [ngValue]="p.id">{{ p.name }} ({{ p.phoneNumber }})</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Doctor</label>
            <select class="form-select" [(ngModel)]="newAppt.doctorId" name="doctor" required>
              <option [ngValue]="null">Select Doctor</option>
              <option *ngFor="let d of doctors" [ngValue]="d.id">Dr. {{ d.name }} - {{ d.specialization }}</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Date & Time</label>
            <input type="datetime-local" class="form-control" [(ngModel)]="newAppt.appointmentDateTime" name="dateTime" [min]="minDateTime" required>
          </div>
          
          <button type="submit" class="btn btn-warning w-100">Book Appointment</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-8">
    <div class="card">
      <div class="card-header bg-secondary text-white">
        <h4 class="mb-0">Today's Appointments</h4>
      </div>
      <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Patient ID</th>
              <th>Doctor ID</th>
              <th>Date/Time</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let a of todaysAppointments">
              <td>{{ a.id }}</td>
              <td>{{ a.patientId }}</td>
              <td>{{ a.doctorId }}</td>
              <td>{{ a.appointmentDateTime | date:'short' }}</td>
            </tr>
            <tr *ngIf="todaysAppointments.length === 0">
              <td colspan="4" class="text-center text-muted py-3">No appointments for today.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
