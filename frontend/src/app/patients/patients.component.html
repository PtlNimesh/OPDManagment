<div class="row">
  <div class="col-md-4">
    <div class="card mb-4">
      <div class="card-header bg-success text-white">
        <h4 class="mb-0">Patient Register</h4>
      </div>
      <div class="card-body">
        <form (ngSubmit)="registerPatient()">
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" [(ngModel)]="newPatient.name" name="name" required minlength="2">
          </div>
          <div class="mb-3">
            <label class="form-label">Gender</label>
            <select class="form-select" [(ngModel)]="newPatient.gender" name="gender" required>
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" [(ngModel)]="newPatient.age" name="age" required min="0">
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" [(ngModel)]="newPatient.phoneNumber" name="phone" placeholder="10 digits" required pattern="^[0-9]{10}$">
          </div>
          <button type="submit" class="btn btn-success w-100">Register Patient</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-md-8">
    <div class="card">
      <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Patient List</h4>
        <div class="d-flex">
          <input type="text" class="form-control form-control-sm me-2" [(ngModel)]="searchQuery" placeholder="Search by name or phone">
          <button class="btn btn-light btn-sm" (click)="search()">Search</button>
        </div>
      </div>
      <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Gender</th>
              <th>Age</th>
              <th>Phone</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let p of patients">
              <td>{{ p.id }}</td>
              <td>{{ p.name }}</td>
              <td>{{ p.gender }}</td>
              <td>{{ p.age }}</td>
              <td>{{ p.phoneNumber }}</td>
              <td>
                <button class="btn btn-danger btn-sm" (click)="deletePatient(p.id)">Delete</button>
              </td>
            </tr>
            <tr *ngIf="patients.length === 0">
              <td colspan="6" class="text-center text-muted py-3">No patients found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
